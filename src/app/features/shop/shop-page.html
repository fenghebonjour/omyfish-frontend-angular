@if (loading()) {
  <div class="text-center py-16 text-gray-400">Loading lures…</div>
} @else {
  <div class="flex flex-col gap-6">
    <h1 class="text-2xl font-bold text-gray-900">Omyshop — Top Lures of 2026</h1>

    @if (error(); as err) {
      <div class="bg-red-50 border border-red-200 rounded-lg p-4 text-red-700 text-sm">{{ err }}</div>
    }

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      @for (p of products(); track p.id) {
        <div class="border rounded-xl p-4 bg-white shadow-sm flex flex-col">
          <a [routerLink]="['/shop', p.id]">
            @if (!failedImageIds().has(p.id)) {
              <img
                [src]="p.imageUrl"
                [alt]="p.name"
                class="w-full h-40 object-cover rounded-lg flex-shrink-0"
                (error)="onImageError(p.id)"
              />
            }
          </a>
          <div class="mt-3 flex-1">
            <a [routerLink]="['/shop', p.id]" class="font-semibold text-gray-900 hover:text-blue-700">
              {{ p.name }}
            </a>
            <p class="text-sm text-gray-500 mt-1 line-clamp-2">{{ p.description }}</p>
          </div>
          <div class="mt-3 flex items-center justify-between">
            <span class="font-semibold text-gray-900">${{ (p.priceCents / 100).toFixed(2) }}</span>
            <button
              (click)="addToCart(p.id)"
              [disabled]="p.stockQuantity <= 0 || addingId() === p.id || auth.isLoading()"
              class="text-sm px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50"
            >
              {{ p.stockQuantity <= 0 ? 'Out of stock' : (addingId() === p.id ? 'Adding…' : 'Add to cart') }}
            </button>
          </div>
        </div>
      }
    </div>
  </div>
}
