<div class="border-t pt-6 mt-2">
  <h2 class="text-lg font-semibold text-gray-900">Admin: Approve a Return</h2>
  <p class="text-sm text-gray-500 mt-1">Enter the order id to approve its return and issue a refund.</p>
  <div class="mt-3 flex items-center gap-2">
    <input
      type="text"
      placeholder="Order id"
      name="orderId"
      [(ngModel)]="orderId"
      class="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
    />
    <button
      (click)="approve()"
      [disabled]="busy() || !orderId"
      class="text-sm px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50"
    >
      {{ busy() ? 'Approving…' : 'Approve return' }}
    </button>
  </div>
  @if (status(); as s) {
    <p class="mt-2 text-sm text-gray-600">{{ s }}</p>
  }
</div>
